[package]
name = "dejavu"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "dejavu"
path = "src/classifier.rs"

[[bin]]
name = "dejavu-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
